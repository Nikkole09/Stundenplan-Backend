spring.application.name=stundenplan.backend

spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://psql.f4.htw-berlin.de:5432/projekt_g4}
spring.datasource.username=${DB_USERNAME:projekt_g4_powergirls}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always


spring.servlet.encoding.charset=UTF-8
spring.servlet.encoding.enabled=true
spring.servlet.encoding.force=true

app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000

# E-Mail-Versand
spring.mail.host=${SMTP_HOST:mail.htw-berlin.de}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

# SMTP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Passwort-Reset
app.passwort-reset.absender=${SMTP_FROM}
app.passwort-reset.frontend-url=${FRONTEND_RESET_URL:http://localhost:4200/passwort-neu-setzen}